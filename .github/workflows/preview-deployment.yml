name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build
        env:
          VITE_API_URL: https://api-preview-pr-${{ github.event.pull_request.number }}.farm-commons.dev
          VITE_APP_VERSION: pr-${{ github.event.pull_request.number }}

      - name: Deploy Frontend to Vercel
        id: deploy-frontend
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          vercel-args: '--prod=false'
          alias-domains: |
            preview-pr-${{ github.event.pull_request.number }}.farm-commons.dev
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: false

      - name: Deploy Backend to Vercel
        id: deploy-backend
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: ./packages/backend
          alias-domains: |
            api-preview-pr-${{ github.event.pull_request.number }}.farm-commons.dev
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: false

      - name: Comment on PR with preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const frontendUrl = '${{ steps.deploy-frontend.outputs.preview-url }}';
            const backendUrl = '${{ steps.deploy-backend.outputs.preview-url }}';

            const comment = `## 🚀 Preview Deployment Ready!

            Your changes have been deployed to a preview environment:

            - **Frontend:** ${frontendUrl}
            - **Backend API:** ${backendUrl}

            ### Preview Environment Details
            - **PR Number:** #${{ github.event.pull_request.number }}
            - **Commit:** ${{ github.event.pull_request.head.sha }}
            - **Branch:** \`${{ github.event.pull_request.head.ref }}\`

            The preview will be automatically updated on new commits and removed when the PR is closed.

            ---
            *Preview deployments are for testing purposes only and use a separate database instance.*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment Ready')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Run smoke tests on preview
        run: |
          echo "Running smoke tests on preview environment..."
          # Wait for deployments to be ready
          sleep 30

          # Test frontend health
          curl -f ${{ steps.deploy-frontend.outputs.preview-url }} || exit 1

          # Test backend health
          curl -f ${{ steps.deploy-backend.outputs.preview-url }}/health || exit 1

          echo "✅ Smoke tests passed!"

  cleanup-preview:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR about cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🧹 Preview Environment Cleaned Up

            The preview deployment for this PR has been removed.

            - **PR Number:** #${{ github.event.pull_request.number }}
            - **Status:** Closed

            Preview URLs are no longer accessible.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
